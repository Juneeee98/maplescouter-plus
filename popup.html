<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 270px; margin: 0; padding: 14px; background: #1c1d22; color: #e8e8ea; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
  small { color: #9a9ba3; display: block; margin-top: 2px; }
  button { width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #f08a24; color: #111; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  #status { color: #9a9ba3; margin: 8px 0 0; min-height: 1em; }
</style>
</head>
<body>
  <h1>MapleScouter Plus</h1>
  <label style="align-items:center">Server names
    <select id="region" style="margin-left:auto;background:#2a2b31;color:#e8e8ea;border:1px solid #444;border-radius:5px;padding:3px 6px">
      <option value="msea">MapleSEA</option>
      <option value="gms">GMS (NA/EU)</option>
    </select></label>
  <label><input type="checkbox" id="hideAds"> <span>Hide ads<small>Blocks ad networks on MapleScouter only.</small></span></label>
  <label><input type="checkbox" id="enabled"> <span>Translate leftover Korean<small>Uses the official English names for your server.</small></span></label>
  <label><input type="checkbox" id="machine"> <span>Backup translation for sentences<small>Chrome's built-in translator, for text the dictionary doesn't cover. Runs on your computer.</small></span></label>
  <button id="dl">Set up backup translator</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
